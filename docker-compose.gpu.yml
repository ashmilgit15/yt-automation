# Use this override on the machine with an NVIDIA GPU:
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
services:
  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
    mem_limit: 8g
    mem_reservation: 2g
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          memory: 2g
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
